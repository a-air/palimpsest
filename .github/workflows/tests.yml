name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 版本链测试
        run: python tests/test_version_chain.py
      - name: 评分口径测试
        run: python tests/test_scoring.py
      - name: 健壮性测试
        run: python tests/test_robustness.py
      - name: 评审回归测试
        run: python tests/test_review_fixes.py
      - name: CLI 冒烟测试
        run: python tests/test_cli_smoke.py
      - name: 语法检查
        run: python -m py_compile refiner.py
