<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1200" viewBox="0 0 880 1200" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="880" height="1200" fill="#0d1117"/>

  <text x="40" y="62" fill="#e6edf3" font-size="26" font-weight="700">Memory that outlives the model</text>
  <text x="40" y="94" fill="#8b949e" font-size="14">Memory that outlives the model — compress, verify, version, seal, rebuild</text>

  <!-- Raw conversation -->
  <rect x="40" y="130" width="800" height="86" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="164" fill="#e6edf3" font-size="17" font-weight="600">Raw conversation</text>
  <text x="64" y="190" fill="#8b949e" font-size="13">full text · timestamps · context — kept verbatim</text>
  <line x1="440" y1="216" x2="440" y2="248" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- 记忆精炼器 -->
  <rect x="40" y="250" width="800" height="150" rx="12" fill="#161b22" stroke="#58a6ff"/>
  <text x="64" y="284" fill="#58a6ff" font-size="17" font-weight="600">Memory Refiner</text>
  <text x="64" y="314" fill="#c9d1d9" font-size="13">· the model extracts facts / decisions / emotions / tasks / anchors</text>
  <text x="64" y="342" fill="#c9d1d9" font-size="13">· script score: F1(recall, precision) × compression — the model writes, never grades</text>
  <text x="64" y="370" fill="#c9d1d9" font-size="13">· probe QA: questions carry gold answers; node-only answering is the real metric</text>
  <line x1="440" y1="400" x2="440" y2="432" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- 宪章层 / 事件层 -->
  <rect x="40" y="434" width="386" height="150" rx="12" fill="#161b22" stroke="#3fb950"/>
  <text x="64" y="468" fill="#3fb950" font-size="16" font-weight="600">Constitution layer</text>
  <text x="64" y="496" fill="#c9d1d9" font-size="13">persona · principles · relationships · personal baselines</text>
  <text x="64" y="522" fill="#8b949e" font-size="12">append-only, never compressed</text>
  <rect x="64" y="540" width="86" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="558" fill="#e6edf3" font-size="12">append-only</text>

  <rect x="454" y="434" width="386" height="150" rx="12" fill="#161b22" stroke="#d29922"/>
  <text x="478" y="468" fill="#d29922" font-size="16" font-weight="600">Facts layer</text>
  <text x="478" y="496" fill="#c9d1d9" font-size="13">facts · provenance · confidence · version chain</text>
  <text x="478" y="522" fill="#8b949e" font-size="12">superseded but never deleted; keep both when unsure</text>
  <rect x="478" y="540" width="86" height="26" rx="13" fill="#21262d" stroke="#30363d"/>
  <text x="494" y="558" fill="#e6edf3" font-size="12">evolving</text>

  <line x1="440" y1="584" x2="440" y2="616" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- 原文档案层 -->
  <rect x="40" y="618" width="800" height="96" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="652" fill="#e6edf3" font-size="17" font-weight="600">Archive layer</text>
  <text x="64" y="678" fill="#8b949e" font-size="13">raw / node / meta triplets, nothing deleted; readable without this program</text>
  <text x="64" y="700" fill="#8b949e" font-size="12">SQLite FTS5: 1.5 ms search over 3,000 nodes (index is disposable)</text>
  <line x1="440" y1="714" x2="440" y2="746" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- 生命周期 -->
  <rect x="40" y="748" width="800" height="150" rx="12" fill="#161b22" stroke="#a371f7"/>
  <text x="64" y="782" fill="#a371f7" font-size="17" font-weight="600">Lifecycle</text>
  <text x="64" y="812" fill="#c9d1d9" font-size="13">hot -> sealed -> review (4 at a time, pass >=85) -> cold storage</text>
  <text x="64" y="840" fill="#8b949e" font-size="12">only refined nodes are read day to day; sealed raw stays out of context</text>
  <text x="64" y="866" fill="#8b949e" font-size="12">crash-recoverable · file lock · three failures go to quarantine</text>
  <line x1="440" y1="898" x2="440" y2="930" stroke="#8b949e" stroke-width="2" marker-end="url(#a)"/>

  <!-- 未来重建 -->
  <rect x="40" y="932" width="800" height="104" rx="12" fill="#161b22" stroke="#58a6ff" stroke-dasharray="6 4"/>
  <text x="64" y="966" fill="#58a6ff" font-size="17" font-weight="600">Rebuild with future models</text>
  <text x="64" y="994" fill="#c9d1d9" font-size="13">let a newer model re-read the old material instead of inheriting today's summary</text>
  <text x="64" y="1018" fill="#8b949e" font-size="12">rebuild / refine / index can always re-run — files are the only truth</text>

  <!-- 页脚 -->
  <text x="40" y="1080" fill="#8b949e" font-size="13" font-style="italic">Some things cannot be handed to the future perfectly. What we can do is not lose them first.</text>
  <text x="40" y="1112" fill="#58a6ff" font-size="13">github.com/a-air/palimpsest</text>
  <text x="40" y="1140" fill="#30363d" font-size="12">MIT · Python stdlib only · 37 tests · CI green</text>
</svg>
